version: "3.9"
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: resolution_hub
      POSTGRES_USER: hub
      POSTGRES_PASSWORD: hubpass
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  backend:
    build: ./backend
    ports: ["8000:8000"]
    environment:
      DATABASE_URL: postgresql+psycopg2://hub:hubpass@db:5432/resolution_hub
      AI_MODE: demo
      LLM_PROVIDER: demo
      AUTO_REFUND_LIMIT: 25000
    depends_on: [db]
  frontend:
    build: ./frontend
    ports: ["5173:80"]
    depends_on: [backend]
volumes:
  pgdata:
